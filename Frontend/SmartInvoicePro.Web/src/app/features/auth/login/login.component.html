
<div class="auth-form">
  <h2>Sign in</h2>
  <p class="subtitle">Welcome back to SmartInvoice Pro</p>
  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="you@company.com" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
  <div class="auth-links">
    <a routerLink="/auth/forgot-password">Forgot password?</a>
    <a routerLink="/auth/register">Create account</a>
  </div>
  <div class="demo-credentials">
    <strong>Demo credentials</strong>
    <p><code>admin@acmeconsulting.in</code> / <code>Admin@123</code></p>
    <p><code>staff@acmeconsulting.in</code> / <code>Staff@123</code></p>
  </div>
</div>
