
<div class="auth-form">
  <h2>Forgot password</h2>
  <p class="subtitle">Enter your email to receive a reset link</p>
  @if (message()) { <div class="alert alert-success">{{ message() }}</div> }
  @if (demoResetToken()) {
    <div class="alert alert-success">
      <strong>Development demo:</strong>
      <a routerLink="/auth/reset-password" [queryParams]="{ token: demoResetToken() }">
        Open reset password page
      </a>
    </div>
  }
  @if (error()) { <div class="alert alert-error">{{ error() }}</div> }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading() || form.invalid">
      {{ loading() ? 'Sending...' : 'Send reset link' }}
    </button>
  </form>
  <p class="auth-link"><a routerLink="/auth/login">Back to sign in</a></p>
</div>
