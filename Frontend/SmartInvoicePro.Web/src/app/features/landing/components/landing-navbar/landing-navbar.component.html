
<header
  class="landing-nav"
  [class.landing-nav--scrolled]="scrolled()"
  role="banner"
>
  <div class="landing-container landing-nav__inner">
    <a routerLink="/" class="landing-nav__logo" aria-label="SmartInvoice Pro Home">
      <span class="landing-nav__logo-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="2" width="16" height="20" rx="3" fill="currentColor" opacity="0.15"/>
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span>SmartInvoice <strong>Pro</strong></span>
    </a>

    <nav class="landing-nav__links" aria-label="Main navigation">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" (click)="closeMobile()">{{ link.label }}</a>
      }
    </nav>

    <div class="landing-nav__actions">
      <button
        type="button"
        class="landing-nav__theme"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.isDark()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        }
      </button>
      <a routerLink="/auth/login" class="landing-nav__login">Login</a>
      <a routerLink="/auth/register" class="landing-btn landing-btn--primary landing-btn--sm" appRipple>Get Started Free</a>
      <button
        type="button"
        class="landing-nav__toggle"
        (click)="mobileOpen.set(!mobileOpen())"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Toggle menu"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div class="landing-nav__mobile" role="dialog" aria-label="Mobile menu">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" (click)="closeMobile()">{{ link.label }}</a>
      }
      <a routerLink="/auth/login" (click)="closeMobile()">Login</a>
      <a routerLink="/auth/register" class="landing-btn landing-btn--primary" (click)="closeMobile()">Get Started Free</a>
    </div>
  }
</header>
