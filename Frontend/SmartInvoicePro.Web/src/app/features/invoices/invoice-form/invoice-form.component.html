
<app-page-header [title]="isEdit ? 'Edit Invoice' : 'Create Invoice'" />
@if (error()) { <div class="alert alert-error">{{ error() }}</div> }
<form [formGroup]="form" (ngSubmit)="submit()" class="card form-card">
  <div class="form-row">
    <div class="form-group"><label>Customer *</label>
      <select formControlName="customerId">
        <option value="">Select customer</option>
        @for (c of customers(); track c.customerId) {
          <option [value]="c.customerId">{{ c.customerName }}</option>
        }
      </select>
    </div>
    <div class="form-group"><label>Invoice Date *</label><input type="date" formControlName="invoiceDate" /></div>
    <div class="form-group"><label>Due Date *</label><input type="date" formControlName="dueDate" /></div>
    @if (isEdit) {
      <div class="form-group"><label>Status</label>
        <select formControlName="status">@for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }</select>
      </div>
    }
  </div>
  <div class="line-items">
    <div class="line-header">
      <h3>Line Items</h3>
      <button type="button" class="btn btn-secondary btn-sm" (click)="addItem()">+ Add Item</button>
    </div>
    <div formArrayName="items">
      @for (item of items.controls; track $index; let i = $index) {
        <div [formGroupName]="i" class="line-item">
          <select formControlName="productId" (change)="onProductSelect(i)">
            <option value="">Custom item</option>
            @for (p of products(); track p.productId) {
              <option [value]="p.productId">{{ p.productName }}</option>
            }
          </select>
          <input formControlName="productName" placeholder="Product name" />
          <input type="number" formControlName="quantity" placeholder="Qty" step="0.01" />
          <input type="number" formControlName="unitPrice" placeholder="Price" step="0.01" />
          <input type="number" formControlName="discount" placeholder="Discount" step="0.01" />
          <button type="button" class="btn btn-danger btn-sm" (click)="removeItem(i)" [disabled]="items.length <= 1">×</button>
        </div>
      }
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Discount Amount (₹)</label><input type="number" formControlName="discountAmount" step="0.01" /></div>
    <div class="form-group"><label>Notes</label><textarea formControlName="notes" rows="2"></textarea></div>
  </div>
  <div class="form-actions">
    <a routerLink="/invoices" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary" [disabled]="loading() || form.invalid">{{ loading() ? 'Saving...' : 'Save Invoice' }}</button>
  </div>
</form>
