
<app-page-header title="Record Payment" />
@if (error()) { <div class="alert alert-error">{{ error() }}</div> }
<form [formGroup]="form" (ngSubmit)="submit()" class="card form-card">
  <div class="form-group"><label>Invoice *</label>
    <select formControlName="invoiceId">
      <option value="">Select invoice</option>
      @for (inv of invoices(); track inv.invoiceId) {
        <option [value]="inv.invoiceId">{{ inv.invoiceNumber }} — {{ inv.customerName }} (Bal: ₹{{ inv.balanceAmount }})</option>
      }
    </select>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Payment Date *</label><input type="date" formControlName="paymentDate" /></div>
    <div class="form-group"><label>Amount (₹) *</label><input type="number" formControlName="amountPaid" step="0.01" /></div>
    <div class="form-group"><label>Method *</label>
      <select formControlName="paymentMethod">@for (m of methods; track m) { <option [value]="m">{{ m }}</option> }</select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Reference #</label><input formControlName="referenceNumber" /></div>
    <div class="form-group"><label>Notes</label><input formControlName="notes" /></div>
  </div>
  <div class="form-actions">
    <a routerLink="/payments" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary" [disabled]="loading() || form.invalid">{{ loading() ? 'Saving...' : 'Record Payment' }}</button>
  </div>
</form>
