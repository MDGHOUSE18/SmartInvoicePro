
<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <app-sidebar [collapsed]="sidebarCollapsed()" [mobile]="isMobile()" (toggle)="isMobile() ? closeMobile() : toggleSidebar()" />
  <div class="layout-main">
    <app-header (menuToggle)="toggleSidebar()" />
    <main class="content">
      <router-outlet />
    </main>
    <app-footer />
  </div>
  @if (showWelcome()) {
    <app-welcome-dialog (closed)="showWelcome.set(false)" />
  }
  @if (isMobile() && mobileOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobile()"></div>
  }
</div>
