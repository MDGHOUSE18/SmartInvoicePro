
@if (open) {
  <div class="overlay" (click)="onCancel()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3>{{ title }}</h3>
      <p>{{ message }}</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">{{ cancelLabel }}</button>
        <button type="button" class="btn" [class.btn-danger]="danger" [class.btn-primary]="!danger" (click)="onConfirm()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
